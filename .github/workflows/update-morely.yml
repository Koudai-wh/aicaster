name: Update Morely

on:
  push:
    branches: [main]
    paths:
      - "generate_morely.js"
      - ".github/workflows/update-morely.yml"
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morely-publishing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Research and draft one Morely article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node generate_morely.js
      - name: Build Morely pages and sitemap
        run: node build_morely.js
      - name: Commit generated article
        run: |
          git config user.name "morely-editor-bot"
          git config user.email "morely-editor-bot@users.noreply.github.com"
          git add blog.json sitemap.xml index.html news.html aicaster/ morely/
          git diff --cached --quiet || (git commit -m "Publish weekly Morely article" && git push)
      - name: Check InfinityFree deployment settings
        id: ftp-config
        env:
          FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.INFINITYFREE_FTP_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_DIR" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "InfinityFree FTP settings are incomplete; skipping deployment."
          fi
      - name: Deploy static site to InfinityFree
        if: ${{ steps.ftp-config.outputs.enabled == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: ${{ secrets.INFINITYFREE_FTP_DIR }}
          protocol: ftps
          local-dir: ./
          exclude: |
            **/.git*/**
            **/.github/**
            README.md
            feeds.json
            update_news.js
            update_ai_room.js
            generate_morely.js
