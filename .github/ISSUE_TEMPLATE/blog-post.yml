name: Morely記事を投稿
description: 運営者向けの記事投稿フォームです。送信後に記事が公開されます。
title: "Morely記事投稿"
body:
  - type: markdown
    attributes:
      value: |
        GitHubアカウントで投稿します。運営者アカウントから送信した記事はサイトに公開されます。検索対象にするMorely記事は、本文を1,500〜2,500文字程度にし、下記5つの見出しをすべて含め、参照資料を2件以上挙げてください。未実施の検証や体験を一人称で書かないでください。
        ## はじめに
        ## 背景
        ## 仕組みの解説
        ## 検証・考察
        ## 今後の展望とまとめ
        条件を満たさない投稿もサイトでは読めますが、自動でnoindexになります。画像の利用許諾と出典を必ず確認してください。
  - type: input
    id: article_title
    attributes:
      label: 記事タイトル
      placeholder: 記事のタイトル
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      options:
        - AI・テック
        - 経済・社会
        - その他
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: 一覧用の紹介文
      description: 記事一覧に表示する短い紹介文です。
      placeholder: この記事で伝えたいことを短く書いてください。
    validations:
      required: true
      max_length: 300
  - type: textarea
    id: sources
    attributes:
      label: 出典資料（2件以上）
      description: 1行に「資料名 | https://...」の形で入力してください。可能なら一次資料を含めてください。
      placeholder: |
        発表元の資料 | https://example.com/primary-source
        公的機関の解説 | https://example.com/guide
    validations:
      required: true
      max_length: 3000
  - type: input
    id: image_url
    attributes:
      label: アイキャッチ画像URL（任意）
      description: HTTPSの画像URLか、サイト内の / から始まる画像パスを指定してください。
  - type: input
    id: image_alt
    attributes:
      label: 画像の代替テキスト（任意）
      description: 画像が表示されない場合に伝える内容を書いてください。
      placeholder: 画像が何を示しているか
  - type: input
    id: image_caption
    attributes:
      label: 画像の説明（任意）
      placeholder: 図の内容や撮影者など
  - type: input
    id: image_source_url
    attributes:
      label: 画像の出典・ライセンスURL（任意）
      description: 利用許諾を確認できるページを入力してください。
      placeholder: https://example.com/license
  - type: textarea
    id: article_body
    attributes:
      label: 本文
      description: 段落を分けて入力してください。
      placeholder: |
        ## はじめに
        ニュースの要点と注目点

        ## 背景
        なぜ今これが重要なのか

        ## 仕組みの解説
        初心者向けの説明

        ## 検証・考察
        実際に確認した内容、手順、結果、限界

        ## 今後の展望とまとめ
        事実と予測を分けてまとめる
    validations:
      required: true
      max_length: 12000
