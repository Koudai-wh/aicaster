<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>AIばっか｜AIのことを、気軽に。</title>
  <meta name="description" content="AIのニュース、使い方、暮らしへの影響を気軽に読めるブログです。">
  <style>
    :root{--bg:#f7f8fa;--paper:#fff;--ink:#202124;--muted:#60656d;--line:#e2e5e9;--blue:#1769aa;--blue-soft:#eaf3fb;--sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.85;-webkit-font-smoothing:antialiased}a{color:inherit}.wrap{width:min(100% - 40px,860px);margin:auto}
    .return{padding:22px 0 14px}.return a{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:.9rem;font-weight:650;text-decoration:none}.return a:hover{text-decoration:underline;text-underline-offset:4px}
    .masthead{padding:46px 0 32px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:750;letter-spacing:.16em}.brand{margin:5px 0 4px;font-size:clamp(3rem,10vw,5.2rem);line-height:1.08;letter-spacing:-.055em;font-weight:850}.tagline{margin:0;color:var(--muted);font-size:1rem}
    main{padding:34px 0 72px}.section-title{font-size:1.2rem;line-height:1.5;margin:0 0 16px}.intro{margin-bottom:42px}.intro p{margin:0;color:var(--muted)}
    .posts{display:grid;gap:14px}.post{display:block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-decoration:none;transition:border-color .15s,transform .15s}.post:hover{border-color:#9bbbd4;transform:translateY(-1px)}.meta{font-size:.78rem;color:var(--muted)}.category{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--blue-soft);color:#245b83;font-size:.72rem;font-weight:650}h2{font-size:1.3rem;line-height:1.5;margin:8px 0}.excerpt{margin:0;color:var(--muted);font-size:.92rem}
    .article{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(24px,6vw,54px);}.article h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.4;letter-spacing:-.025em;margin:13px 0 0}.article .body{white-space:pre-line;line-height:2.15;font-size:1.02rem;margin-top:28px}.article-footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px}.back-list{color:var(--blue);text-decoration:none;font-weight:650}.back-list:hover{text-decoration:underline;text-underline-offset:4px}
    .author{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;margin-top:46px;padding:22px;background:#eef3f7;border-radius:14px}.avatar{width:52px;height:52px;display:grid;place-items:center;background:#d8e8f5;border-radius:50%;color:#245b83;font-size:1.25rem;font-weight:800}.author h2{font-size:1rem;margin:0 0 4px}.author p{margin:0;color:var(--muted);font-size:.88rem}
    .comments{margin-top:48px;padding-top:28px;border-top:1px solid var(--line)}.comments h2{font-size:1.2rem;margin:0 0 8px}.comments-intro,.comments-pending{font-size:.88rem;color:var(--muted)}.comments-pending{background:var(--paper);border:1px dashed #cbd2d9;border-radius:12px;padding:16px;margin-top:16px}
    .empty{padding:24px;background:var(--paper);border:1px dashed var(--line);border-radius:12px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0 38px;color:var(--muted);font-size:.78rem}footer p{margin:0}
    @media(max-width:600px){.wrap{width:min(100% - 32px,860px)}.return{padding-top:16px}.masthead{padding:34px 0 24px}.tagline{font-size:.92rem}.post{padding:18px}.posts{gap:10px}main{padding-top:26px}.author{padding:18px;grid-template-columns:44px 1fr}.avatar{width:44px;height:44px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="return"><a href="index.html">← AI Casterに戻る</a></div>
    <header class="masthead">
      <div class="eyebrow">AIの話を、もっと身近に。</div>
      <div class="brand">AIばっか</div>
      <p class="tagline">気になるAIのニュースや使い方を、わかりやすく。</p>
    </header>
    <main>
      <div id="content" aria-live="polite"><div class="empty">記事を読み込んでいます…</div></div>
      <section class="author" aria-labelledby="author-title">
        <div class="avatar" aria-hidden="true">A</div>
        <div><h2 id="author-title">運営者について</h2><p>中学生が運営する、AIを活用したサイトです。AIのニュースや使い方を調べ、同じ世代にも伝わるようにわかりやすく紹介します。</p></div>
      </section>
    </main>
  </div>
  <footer><div class="wrap"><p>© <span id="year"></span> AIばっか</p></div></footer>
  <script>
    (function(){
      "use strict";
      var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
      var content=document.getElementById("content");
      document.getElementById("year").textContent=new Date().getFullYear();
      fetch("blog.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("blog unavailable");return r.json()}).then(function(data){
        var posts=Array.isArray(data)?data:(data.posts||[]),slug=new URLSearchParams(location.search).get("slug");
        posts.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
        if(slug){
          var p=posts.filter(function(x){return x.slug===slug})[0];
          if(!p){content.innerHTML='<h1 class="section-title">記事が見つかりません</h1><a class="back-list" href="blog.html">AIばっかの記事一覧へ戻る</a>';return}
          document.title=p.title+"｜AIばっか";
          content.innerHTML='<article class="article"><div class="meta">'+esc(p.date)+(p.category?'<span class="category">'+esc(p.category)+'</span>':'')+'</div><h1>'+esc(p.title)+'</h1><div class="body">'+esc(p.body||"")+'</div><div class="article-footer"><a class="back-list" href="blog.html">← AIばっかの記事一覧へ戻る</a></div></article>'+commentsHTML(p.slug);
          return;
        }
        content.innerHTML='<section class="intro"><h1 class="section-title">AIのこと、あれこれ。</h1><p>ニュースの背景や、AIを使ってみた感想を気軽に読めるブログです。</p></section><section aria-label="記事一覧"><h2 class="section-title">記事一覧</h2><div class="posts">'+(posts.length?posts.map(function(p){return '<a class="post" href="blog.html?slug='+encodeURIComponent(p.slug)+'"><div class="meta">'+esc(p.date)+(p.category?'<span class="category">'+esc(p.category)+'</span>':'')+'</div><h2>'+esc(p.title)+'</h2><p class="excerpt">'+esc(p.excerpt||"")+'</p></a>'}).join(""):'<div class="empty">記事はまだありません。</div>')+'</div></section>';
      }).catch(function(){content.innerHTML='<div class="empty">記事を読み込めませんでした。少し待ってから再読み込みしてください。</div>'});
      function commentsHTML(slug){
        // Giscus の接続情報を設定すると、記事ごとのコメント欄に切り替わります。
        var config={repo:"",repoId:"",category:"",categoryId:""};
        if(!config.repo||!config.repoId||!config.category||!config.categoryId){return '<section class="comments" aria-labelledby="comments-title"><h2 id="comments-title">コメント</h2><p class="comments-intro">この記事についての感想や質問をお待ちしています。</p><div class="comments-pending">コメント欄は準備中です。安全に管理できるコメント機能を設定しています。</div></section>'}
        return '<section class="comments" aria-labelledby="comments-title"><h2 id="comments-title">コメント</h2><p class="comments-intro">GitHubアカウントでログインしてコメントできます。投稿は公開され、GitHub Discussionsで管理されます。</p><div class="giscus"></div><script src="https://giscus.app/client.js" data-repo="'+esc(config.repo)+'" data-repo-id="'+esc(config.repoId)+'" data-category="'+esc(config.category)+'" data-category-id="'+esc(config.categoryId)+'" data-mapping="specific" data-term="'+esc(location.origin+location.pathname+"?slug="+slug)+'" data-strict="1" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top" data-theme="light" data-lang="ja" crossorigin="anonymous" async><\/script></section>';
      }
    })();
  </script>
</body>
</html>
