<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIブログ — AI Caster</title>
  <meta name="description" content="生成AIやAIサービスの動きを、わかりやすく紹介するAI Casterのブログです。">
  <style>
    :root{--bg:#fff;--surface:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1769aa;--accent-soft:#e8f1f8;--sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 24px}
    .top{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}.brandline{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:26px 0 18px;flex-wrap:wrap}.brand{font:750 3rem/1 var(--sans);text-decoration:none}.tag{font:500 .85rem var(--sans);color:var(--muted);margin-left:12px}.nav{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--line)}.nav a{text-decoration:none;font-size:.9rem;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}.nav a:hover,.nav a.active{color:var(--accent)}.nav a.active{font-weight:700;border-color:var(--accent);color:var(--accent)}
    main{max-width:900px;padding:44px 24px 72px;margin:auto}.eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--muted)}h1{font:700 clamp(2rem,5vw,2.6rem)/1.3 var(--sans);margin:5px 0 8px}.intro{color:var(--muted);font-size:.9rem}.post{display:block;margin-top:20px;padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-decoration:none}.post:hover{border-color:var(--accent)}.meta{font-size:.78rem;color:var(--muted)}h2{font:700 1.4rem/1.5 var(--sans);margin:6px 0}.excerpt{color:var(--muted);font-size:.9rem}.article{margin-top:20px;padding:clamp(24px,5vw,48px);border:1px solid var(--line);background:var(--surface);border-radius:10px}.article h1{font-size:clamp(1.8rem,4vw,2.5rem);margin-top:10px}.body{white-space:pre-line;line-height:2.15;font-size:1.04rem;margin-top:28px}.back{display:inline-block;color:var(--accent);margin-top:32px}.notice{margin-top:24px;padding:18px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}.ad-wrap{margin:28px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.ad-label{font-size:.65rem;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}.ad-slot{min-height:100px;display:grid;place-items:center;border:1px dashed var(--line);color:#9aa0a6;font-size:.75rem;overflow:hidden}.ad-slot.rect{min-height:250px}footer{border-top:1px solid var(--text);padding:28px 0 48px;font-size:.78rem;color:var(--muted)}footer p{margin-top:4px}footer a{margin-right:18px}
    @media(max-width:640px){.brand{font-size:2.3rem}.tag{display:block;margin:8px 0 0}.post,.article{padding:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><span id="today"></span><span>AIの話題・コラム</span></div>
    <header class="brandline"><a class="brand" href="index.html">AI Caster<span class="tag">むずかしいニュースを、三行で。</span></a></header>
    <nav class="nav" aria-label="メインメニュー"><a href="index.html">トップ・ニュース</a><a href="ai-room.html">AI会議室</a><a class="active" href="blog.html">AIブログ</a></nav>
  </div>
  <main>
    <div class="eyebrow">AI BLOG</div>
    <div id="content" aria-live="polite"><div class="notice">ブログを読み込んでいます…</div></div>
  </main>
  <footer><div class="wrap"><p><a href="index.html">ニューストップ</a><a href="ai-room.html">AI会議室</a></p><p>© <span id="year"></span> AI Caster</p></div></footer>
  <script>
    (function(){
      "use strict";
      var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
      document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
      document.getElementById("year").textContent=new Date().getFullYear();
      fetch("blog.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){var posts=Array.isArray(data)?data:(data.posts||[]),slug=new URLSearchParams(location.search).get("slug"),content=document.getElementById("content");
        if(slug){var p=posts.filter(function(x){return x.slug===slug})[0];if(!p){content.innerHTML='<h1>記事が見つかりません</h1><a class="back" href="blog.html">AIブログ一覧へ戻る</a>';return}document.title=p.title+" — AI Caster";content.innerHTML='<article class="article"><div class="meta">'+esc(p.date)+(p.category?' ・ '+esc(p.category):'')+'</div><h1>'+esc(p.title)+'</h1><div class="body">'+esc(p.body||'')+'</div><a class="back" href="blog.html">← AIブログ一覧へ戻る</a></article>';return}
        posts.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});content.innerHTML='<h1>AIブログ</h1><p class="intro">生成AIやAIサービスの動きを、初心者にもわかりやすく紹介します。</p>'+(posts.length?posts.map(function(p){return '<a class="post" href="blog.html?slug='+encodeURIComponent(p.slug)+'"><div class="meta">'+esc(p.date)+(p.category?' ・ '+esc(p.category):'')+'</div><h2>'+esc(p.title)+'</h2><p class="excerpt">'+esc(p.excerpt||'')+'</p></a>'}).join(''):'<div class="notice">AIブログ記事はまだありません。</div>');
      }).catch(function(){document.getElementById("content").innerHTML='<h1>AIブログ</h1><div class="notice">ブログを読み込めませんでした。少し待ってから再読み込みしてください。</div>'});
    })();
  </script>
</body>
</html>
