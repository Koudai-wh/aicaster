<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIブログ — AI Caster</title>
  <meta name="description" content="生成AIやAIサービスの動きを、わかりやすく紹介するAI Casterのブログです。">
  <style>
    :root{--bg:#fff;--surface:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1769aa;--accent-soft:#e8f1f8;--sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 24px}
    .top{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}.brandline{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:26px 0 18px;flex-wrap:wrap}.brand{font:750 3rem/1 var(--sans);text-decoration:none}.tag{font:500 .85rem var(--sans);color:var(--muted);margin-left:12px}.nav{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--line)}.nav a{text-decoration:none;font-size:.9rem;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}.nav a:hover,.nav a.active{color:var(--accent)}.nav a.active{font-weight:700;border-color:var(--accent);color:var(--accent)}
    main{max-width:900px;padding:44px 24px 72px;margin:auto}.eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--muted)}h1{font:700 clamp(2rem,5vw,2.6rem)/1.3 var(--sans);margin:5px 0 8px}.intro{color:var(--muted);font-size:.9rem}.post{display:block;margin-top:20px;padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-decoration:none}.post:hover{border-color:var(--accent)}.meta{font-size:.78rem;color:var(--muted)}h2{font:700 1.4rem/1.5 var(--sans);margin:6px 0}.excerpt{color:var(--muted);font-size:.9rem}.article{margin-top:20px;padding:clamp(24px,5vw,48px);border:1px solid var(--line);background:var(--surface);border-radius:10px}.article h1{font-size:clamp(1.8rem,4vw,2.5rem);margin-top:10px}.body{white-space:pre-line;line-height:2.15;font-size:1.04rem;margin-top:28px}.back{display:inline-block;color:var(--accent);margin-top:32px}.notice{margin-top:24px;padding:18px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}.ad-wrap{margin:28px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.ad-label{font-size:.65rem;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}.ad-slot{min-height:100px;display:grid;place-items:center;border:1px dashed var(--line);color:#9aa0a6;font-size:.75rem;overflow:hidden}.ad-slot.rect{min-height:250px}footer{border-top:1px solid var(--text);padding:28px 0 48px;font-size:.78rem;color:var(--muted)}footer p{margin-top:4px}footer a{margin-right:18px}
    @media(max-width:640px){.brand{font-size:2.3rem}.tag{display:block;margin:8px 0 0}.post,.article{padding:16px}}
  </style>

  <script>
(function () {
  "use strict";
  try {
    /* 同じページに2回設置された場合、2回目は処理しない */
    if (window.__ninjaAdMaxAbdLoaded) { return; }
    window.__ninjaAdMaxAbdLoaded = true;

    /* ============== ここから編集可能 ============== */
    var CONFIG = {

      /* 表示メッセージ(2種類)
         検知のしかたに応じてどちらかが表示されます
         body に \n を入れるとその位置で改行されます */
      messages: {

        /* ページ上の広告枠が隠されていることを検知した場合。
           サイト単位の解除を案内します */
        forBlockerDetected: {
          title: "広告ブロッカーが有効になっています",
          body: "当サイトは広告収入により運営されています。" +
                "お手数ですが、広告ブロッカーの設定でこのサイト" +
                "(このドメイン)を許可リストに追加したうえで、" +
                "再読み込みボタンを押してください。"
        },

        /* 広告配信サーバーへの通信が失敗した場合。
           何が原因かまでは特定できないため、考えられる
           対処をまとめて案内します */
        forNetworkBlocked: {
          title: "広告がブロックされています",
          body: "当サイトは広告収入により運営されています。" +
                "ブラウザ拡張機能の広告ブロッカーをご利用の場合は、" +
                "このサイトを許可リストに追加してください。" +
                "DNS型・アプリ型のブロッカーをご利用の場合は、" +
                "一時的にオフにしたうえで再読み込みボタンを押してください。"
        }
      },

      /* ボタンの文言 */
      buttonText: "再読み込み",

      /* 背景の色(画面を覆う半透明の黒) */
      overlayColor: "rgba(0, 0, 0, 0.92)",

      /* ボタンの色 */
      buttonColor: "#1a73e8"
    };
    /* ============== ここまで編集可能 ============== */


    /* ---- 内部設定(変更しないでください) ---- */
    var INTERNAL = {
      admaxProbe: "https://adm.shinobi.jp/abd.js",
      baitClasses: "adsbox text-ad textAd ad-placement banner_ad",
      /* おとり要素に付ける id。class だけでなく id でも隠される
         ブロッカーがあるため両方を持たせる */
      baitId: "adsbox",
      /* 対照要素の class。広告を連想させる語を含めないこと
         (含めるとブロッカーが対照要素も隠し、検知が不発になる) */
      refClass: "content-ref-01"
    };

    /* 検知軸。bait / network のいずれか1つが陽性なら表示する */
    var axes = { bait: false, network: false };
    var overlayEl = null;         /* 表示済みの背景要素 */
    var messageShown = false;     /* メッセージを表示済みか */
    var baitSettled = false;      /* bait の判定が確定したか */
    var networkAbandoned = false; /* ネットワーク検知を中止したか */

    /* ネットワーク検知のシグナル。null = 未確定 */
    var signals = {
      admaxFetch: null,         /* true = admaxProbe への fetch が失敗 */
      admaxScript: null         /* true = admaxProbe の script 読み込みが失敗 */
    };

    /* DOM構築完了を待つ */
    function ready(fn) {
      if (document.readyState === "interactive" ||
          document.readyState === "complete") {
        fn();
      } else {
        document.addEventListener("DOMContentLoaded", fn, { once: true });
      }
    }

    function afterPaint(fn) {
      var guarded = function () {
        try { fn(); } catch (e) { }
      };
      if (typeof requestAnimationFrame !== "function") {
        setTimeout(guarded, 32);
        return;
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(guarded);
      });
    }

    function removeEl(el) {
      if (el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }

    /* 検知結果の集約。1軸でも陽性ならまず背景を出して閲覧を止め、
       bait の判定が確定してからメッセージを出す。
       network 軸は bait 軸より先に確定するため、先に表示すると
       文言が後から入れ替わることになる。それを避けるための2段構え */
    function escalate() {
      if (!axes.bait && !axes.network) { return; }
      showScrim();
      showMessage();
    }

    /* オーバーレイ背後をキーボード操作・読み上げの対象外にする */
    function deactivateBackground(overlay) {
      try {
        if (!document.body || !("inert" in HTMLElement.prototype)) { return; }
        var nodes = document.body.children;
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i] !== overlay) {
            nodes[i].inert = true;
          }
        }
      } catch (e) { }
    }

    /* 画面全体を覆う背景。メッセージより先に出して閲覧を止める */
    function showScrim() {
      if (overlayEl) { return; }

      var overlay = document.createElement("div");
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.style.cssText =
        "position:fixed;top:0;left:0;width:100vw;" +
        "height:100vh;height:100dvh;" +
        "z-index:2147483647;overflow:auto;" +
        "display:flex;align-items:flex-start;justify-content:center;" +
        "padding:24px;box-sizing:border-box;";
      overlay.style.background = CONFIG.overlayColor;

      try {
        (document.body || document.documentElement).appendChild(overlay);
      } catch (e) {
        return;
      }

      overlayEl = overlay;
      deactivateBackground(overlay);
      document.documentElement.style.overflow = "hidden";
      if (document.body) {
        document.body.style.overflow = "hidden";
      }

      /* bait の判定が確定しないまま終わった場合の保険。
         背景だけ出て案内も再読み込みボタンも無い状態を残さない */
      setTimeout(function () {
        baitSettled = true;
        showMessage();
      }, 1500);
    }

    /* bait の判定確定後に、背景の中へメッセージを1回だけ出す */
    function showMessage() {
      if (!overlayEl || messageShown || !baitSettled) { return; }

      var msg = axes.bait ? CONFIG.messages.forBlockerDetected
                          : CONFIG.messages.forNetworkBlocked;
      var titleId = "admax-abd-title";
      var bodyId = "admax-abd-body";

      var box = document.createElement("div");
      box.style.cssText =
        "max-width:480px;margin:auto;background:#fff;border-radius:8px;" +
        "padding:32px 28px;text-align:center;" +
        "font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans'," +
        "'Noto Sans JP',Meiryo,sans-serif;color:#202124;";

      var title = document.createElement("div");
      title.id = titleId;
      title.textContent = msg.title;
      title.style.cssText =
        "font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.5;";

      var body = document.createElement("div");
      body.id = bodyId;
      body.textContent = msg.body;
      body.style.cssText =
        "font-size:14px;line-height:1.8;margin-bottom:24px;" +
        "text-align:left;white-space:pre-wrap;";

      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = CONFIG.buttonText;
      btn.style.cssText =
        "display:inline-block;border:none;cursor:pointer;color:#fff;" +
        "font-size:15px;font-weight:600;padding:12px 32px;" +
        "border-radius:6px;";
      btn.style.background = CONFIG.buttonColor;
      btn.addEventListener("click", function () {
        try { location.reload(); } catch (e) { }
      });

      box.appendChild(title);
      box.appendChild(body);
      box.appendChild(btn);

      try {
        overlayEl.appendChild(box);
      } catch (e) {
        return;
      }

      messageShown = true;
      overlayEl.setAttribute("aria-labelledby", titleId);
      overlayEl.setAttribute("aria-describedby", bodyId);
      try { btn.focus(); } catch (e) { }
    }

    /* ---- bait軸: おとり要素による検知 ----
       広告風のclass名を付けた bait と、中立なclass名を付けた対照要素を
       同じスタイルで並べ、bait だけが非表示になった場合に陽性とする */
    var PROBE_STYLE =
      "position:absolute!important;left:-9999px!important;top:-9999px!important;" +
      "width:1px!important;height:1px!important;" +
      "display:block!important;visibility:visible!important;";

    function makeProbeEl(className) {
      var el = document.createElement("div");
      el.className = className;
      el.style.cssText = PROBE_STYLE;
      el.appendChild(document.createTextNode("\u00a0"));
      return el;
    }

    function isHidden(el) {
      var st = window.getComputedStyle(el);
      return el.offsetParent === null ||
             el.offsetHeight === 0 ||
             el.offsetWidth === 0 ||
             st.display === "none" ||
             st.visibility === "hidden";
    }

    function checkBait(recheck) {
      try {
        var host = document.body || document.documentElement;
        var bait = makeProbeEl(INTERNAL.baitClasses);
        var ref = makeProbeEl(INTERNAL.refClass);
        if (!document.getElementById(INTERNAL.baitId)) {
          bait.id = INTERNAL.baitId;
        }
        host.appendChild(bait);
        host.appendChild(ref);

        afterPaint(function () {
          var baitHidden, refHidden;
          try {
            baitHidden = isHidden(bait);
            refHidden = isHidden(ref);
          } finally {
            removeEl(bait);
            removeEl(ref);
          }
          if (baitHidden && !refHidden) {
            axes.bait = true;
          } else if (!recheck) {
            setTimeout(function () { checkBait(true); }, 1000);
            return;
          }
          baitSettled = true;
          escalate();
        });
      } catch (e) { }
    }

    /* ---- ネットワーク軸 ----
       広告配信サーバーへ到達できない場合を陽性とする。fetch と script の
       両方が失敗したことを条件にするのは、fetch 単独では 4xx/5xx と
       遮断を区別できないため。
       ただし遮断とは断定しない。配信側の障害・CSP・DNS・証明書・
       経路障害でも同じ観測になり、スクリプトからは区別できない。
       それでもこの軸単独で全面表示するのは、DNS 型ブロッカーの利用者が
       bait 軸に現れず、この軸でしか捕捉できないため             */
    function decideNetwork() {
      try {
        if (networkAbandoned || axes.network) { return; }
        if (signals.admaxFetch !== true) { return; }
        if (signals.admaxScript !== true) { return; }
        axes.network = true;
        escalate();
      } catch (e) { }
    }

    /* GET を使う。HEAD に変えないこと(理由は設計メモを参照) */
    function probeFetch(url) {
      return fetch(url, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        credentials: "omit"
      });
    }

    function checkNetwork() {
      if (typeof fetch !== "function") {
        networkAbandoned = true;
        return;
      }
      probeFetch(INTERNAL.admaxProbe).then(
        function () { signals.admaxFetch = false; decideNetwork(); },
        function () { signals.admaxFetch = true; decideNetwork(); }
      );
    }

    /* ---- script軸 ---- */
    function checkScript() {
      try {
        var s = document.createElement("script");
        s.src = INTERNAL.admaxProbe;
        s.async = true;
        /* 参照元のURLを送らない */
        s.referrerPolicy = "no-referrer";
        var settle = function (blocked) {
          signals.admaxScript = blocked;
          removeEl(s);
          decideNetwork();
        };
        s.onerror = function () { settle(true); };
        s.onload = function () { settle(false); };
        (document.head || document.documentElement).appendChild(s);
      } catch (e) { }
    }

    /* 実行開始: DOM構築 → 描画完了 → bait / network 並行で検知 */
    ready(function () {
      afterPaint(function () {
        checkBait(false);
        checkScript();
        checkNetwork();
      });
    });
  } catch (e) { /* このスクリプトが原因でサイトを壊さない */ }
})();
</script>

<body>
  <div class="wrap">
    <div class="top"><span id="today"></span><span>AIの話題・コラム</span></div>
    <header class="brandline"><a class="brand" href="index.html">AI Caster<span class="tag">むずかしいニュースを、三行で。</span></a></header>
    <nav class="nav" aria-label="メインメニュー"><a href="index.html">トップ・ニュース</a><a href="ai-room.html">AI会議室</a><a class="active" href="blog.html">AIブログ</a></nav>
  </div>
  <main>
    <div class="eyebrow">AI BLOG</div>
    <div id="content" aria-live="polite"><div class="notice">ブログを読み込んでいます…</div></div>
  </main>
  <footer><div class="wrap"><p><a href="index.html">ニューストップ</a><a href="ai-room.html">AI会議室</a></p><p>© <span id="year"></span> AI Caster</p></div></footer>
  <script>
    (function(){
      "use strict";
      var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
      function activateAds(){document.querySelectorAll("[data-admax-slot]").forEach(function(slot){if(slot.dataset.loaded)return;slot.dataset.loaded="true";var s=document.createElement("script");s.async=true;s.src="https://adm.shinobi.jp/st/auto.js";s.dataset.admaxId="5f0948c4cb944468012d58c17daab4bc";slot.appendChild(s)})}
      document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
      document.getElementById("year").textContent=new Date().getFullYear();
      fetch("blog.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){var posts=Array.isArray(data)?data:(data.posts||[]),slug=new URLSearchParams(location.search).get("slug"),content=document.getElementById("content");
        var ad='<div class="ad-wrap"><div class="ad-label">広告</div><div class="ad-slot rect" data-admax-slot></div></div>';
        if(slug){var p=posts.filter(function(x){return x.slug===slug})[0];if(!p){content.innerHTML='<h1>記事が見つかりません</h1><a class="back" href="blog.html">AIブログ一覧へ戻る</a>';return}document.title=p.title+" — AI Caster";content.innerHTML='<article class="article"><div class="meta">'+esc(p.date)+(p.category?' ・ '+esc(p.category):'')+'</div><h1>'+esc(p.title)+'</h1><div class="body">'+esc(p.body||'')+'</div><a class="back" href="blog.html">← AIブログ一覧へ戻る</a></article>'+ad;activateAds();return}
        posts.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});content.innerHTML='<h1>AIブログ</h1><p class="intro">生成AIやAIサービスの動きを、初心者にもわかりやすく紹介します。</p>'+(posts.length?posts.map(function(p){return '<a class="post" href="blog.html?slug='+encodeURIComponent(p.slug)+'"><div class="meta">'+esc(p.date)+(p.category?' ・ '+esc(p.category):'')+'</div><h2>'+esc(p.title)+'</h2><p class="excerpt">'+esc(p.excerpt||'')+'</p></a>'}).join('')+ad:'<div class="notice">AIブログ記事はまだありません。</div>');activateAds();
      }).catch(function(){document.getElementById("content").innerHTML='<h1>AIブログ</h1><div class="notice">ブログを読み込めませんでした。少し待ってから再読み込みしてください。</div>'});
    })();
  </script>
</body>
