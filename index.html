<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Caster — AIが三行でまとめるニュース</title>
<meta name="description" content="AI Casterは、むずかしいニュースをAIが三行でまとめて届けるニュースサイトです。">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #202124;
    --muted: #5f6368;
    --line: #dadce0;
    --accent: #1769aa;
    --accent-soft: #e8f1f8;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.8; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* top bar */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .75rem; color: var(--muted); }
  .topbar .right { display: flex; gap: 20px; }
  .topbar a { text-decoration: none; }
  .topbar a:hover { color: var(--accent); }

  /* masthead */
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 26px 0 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: flex-end; gap: 12px; text-decoration: none; }
  .logo { font-family: var(--sans); font-size: 3.7rem; font-weight: 750; line-height: 1; letter-spacing: .02em; }
  .badge { background: var(--accent); color: #fff; font-size: .68rem; font-weight: 700; padding: 5px 9px; letter-spacing: .05em; margin-bottom: 10px; }
  .tagline { font-family: var(--sans); color: var(--muted); font-size: .9rem; font-weight: 500; margin-bottom: 8px; letter-spacing: .02em; }
  .search { width: 340px; max-width: 100%; }
  .search input { width: 100%; padding: 11px 14px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: .88rem; outline: none; }
  .search input:focus { border-color: var(--accent); }

  /* nav */
  .navline { border-top: 0; border-bottom: 1px solid var(--line); }
  nav { display: flex; flex-wrap: wrap; gap: 2px 6px; }
  nav a { font-size: .9rem; padding: 10px 14px; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: .04em; }
  nav a:hover { color: var(--accent); }
  nav a.active { font-weight: 700; border-bottom-color: var(--accent); color: var(--accent); }

  /* layout */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; padding: 40px 0 64px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; gap: 32px; } .logo { font-size: 3.2rem; } }

  .eyebrow { font-size: .72rem; letter-spacing: .25em; color: var(--muted); }
  .page-title { font-family: var(--sans); font-weight: 700; font-size: 2.3rem; line-height: 1.3; margin: 4px 0 8px; }
  .page-sub { color: var(--muted); font-size: .9rem; max-width: 620px; }
  .section-head { margin: 36px 0 0; padding-bottom: 6px; display: inline-block; font-family: var(--sans); font-size: 1.1rem; font-weight: 700; border-bottom: 3px solid var(--accent); }

  /* article */
  .article { display: grid; grid-template-columns: 130px 1fr; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--line); }
  .article:first-of-type { border-top: 0; }
  .meta { font-size: .75rem; color: var(--muted); }
  .cat { font-weight: 700; font-size: .78rem; margin-bottom: 8px; }
  .cat::before { content: "◆"; font-size: .6rem; margin-right: 4px; vertical-align: 1px; }
  .meta .date { font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.7; }
  .meta .read { margin-top: 6px; }
  .article h3 { font-family: var(--sans); font-size: 1.4rem; line-height: 1.5; font-weight: 700; }
  .article h3 a { text-decoration: none; }
  .article h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .reason { font-size: .75rem; color: var(--accent); margin: 2px 0 8px; }
  .three { list-style: none; margin-top: 10px; }
  .three li { display: grid; grid-template-columns: 28px 1fr; font-size: .95rem; padding: 3px 0; }
  .three li::before { content: attr(data-n); font-family: var(--sans); color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags button { border: 1px solid var(--line); font-size: .7rem; color: var(--muted); padding: 1px 8px; }
  .tags button:hover { border-color: var(--accent); color: var(--accent); }
  .src { font-size: .72rem; color: var(--muted); margin-top: 8px; }
  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .topbar { align-items: flex-start; flex-direction: column; gap: 4px; padding: 9px 0; font-size: .72rem; }
    .topbar .right { gap: 16px; flex-wrap: wrap; }
    .masthead { align-items: stretch; gap: 16px; padding: 20px 0 16px; }
    .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
    .logo { font-size: 2.65rem; }
    .tagline { margin: 0; font-size: .82rem; }
    .search { width: 100%; }
    .search input { min-height: 44px; }
    .navline nav { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .navline nav a { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; min-height: 44px; padding: 9px 14px; text-align: center; white-space: nowrap; font-size: .82rem; letter-spacing: 0; }
    .layout { padding: 24px 0 48px; gap: 28px; }
    .page-title { font-size: 1.8rem; }
    .page-sub { font-size: .9rem; }
    .section-head { margin-top: 28px; }
    .article { grid-template-columns: 1fr; gap: 6px; }
    .article { padding: 22px 0; }
    .meta { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .cat { margin-bottom: 0; }
    .meta .date { display: flex; gap: 6px; }
    .meta .read { margin-top: 0; }
    .article h3 { font-size: 1.12rem; line-height: 1.55; }
    .three li { grid-template-columns: 24px 1fr; font-size: .93rem; line-height: 1.75; }
    .tags button { min-height: 30px; }
    .room-card, .blog-article { padding: 16px; }
    .room-line { grid-template-columns: 1fr; gap: 0; }
    aside { border-top: 1px solid var(--line); padding-top: 24px; }
    .ad-slot.rect { min-height: 220px; }
    footer { padding: 24px 0 36px; }
    footer nav { gap: 12px 16px; }
    footer p { line-height: 1.7; }
  }

  .more { display: block; margin: 28px auto 0; padding: 10px 36px; border: 1px solid var(--line); border-radius: 8px; font-size: .85rem; }
  .more:hover { background: var(--text); color: #fff; }
  .notice-box { margin-top: 24px; padding: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .88rem; }

  /* AI会議室・ブログ */
  .room-card, .blog-card, .blog-article { margin-top: 20px; padding: 22px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
  .room-date, .blog-meta { color: var(--muted); font-size: .78rem; }
  .room-title, .blog-title { font-family: var(--sans); font-weight: 700; font-size: 1.35rem; line-height: 1.5; margin: 5px 0 14px; }
  .room-talk { display: grid; gap: 12px; }
  .room-line { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
  .room-speaker { color: var(--accent); font-size: .8rem; font-weight: 700; }
  .room-line p { font-size: .92rem; }
  .room-sources { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px; font-size: .78rem; color: var(--muted); }
  .room-sources a { color: var(--accent); }
  .blog-card { text-decoration: none; display: block; }
  .blog-card:hover { border-color: var(--accent); }
  .blog-title { margin-bottom: 6px; }
  .blog-excerpt { color: var(--muted); font-size: .88rem; }
  .blog-body { white-space: pre-line; line-height: 2; margin-top: 20px; }
  .back-link { display: inline-block; margin-top: 24px; color: var(--accent); }

  /* sidebar */
  aside h4 { font-family: var(--sans); font-size: 1.05rem; padding-bottom: 8px; border-bottom: 1px solid var(--text); display: flex; justify-content: space-between; align-items: baseline; }
  aside h4 button { font-family: var(--sans); font-size: .72rem; color: var(--muted); }
  aside h4 button:hover { color: var(--accent); }
  .block { margin-bottom: 40px; }
  .interest { margin-top: 14px; }
  .bar-row { display: flex; justify-content: space-between; font-size: .75rem; font-weight: 700; margin-bottom: 4px; }
  .bar-row .n { color: var(--muted); font-weight: 400; }
  .bar { height: 4px; background: var(--line); margin-bottom: 14px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .side-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .side-tags button { border: 1px solid var(--line); background: #fff; font-size: .72rem; padding: 2px 9px; }
  .side-tags button:hover { border-color: var(--accent); color: var(--accent); }
  .side-empty { font-size: .82rem; color: var(--muted); margin-top: 14px; }
  .hist { list-style: none; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist a { font-size: .85rem; line-height: 1.6; text-decoration: none; font-weight: 700; }
  .hist a:hover { color: var(--accent); }
  .hist .t { font-size: .7rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; margin-top: 2px; }
  .hist .x { color: var(--muted); font-size: 1rem; line-height: 1; align-self: flex-start; }
  .hist .x:hover { color: var(--accent); }

  /* ad */
  .ad-wrap { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .ad-label { font-size: .65rem; color: var(--muted); margin-bottom: 4px; letter-spacing: .1em; }
  .ad-slot { min-height: 100px; display: grid; place-items: center; border: 1px dashed var(--line); color: #b5aea2; font-size: .72rem; overflow: hidden; }
  .ad-slot.rect { min-height: 250px; }
  /* 広告タグ設置後は .ad-slot の破線と .ad-placeholder を削除してください */

  footer { border-top: 1px solid var(--text); padding: 28px 0 48px; font-size: .78rem; color: var(--muted); }
  footer nav { margin-bottom: 8px; gap: 4px 20px; }
  footer nav a { padding: 0; font-size: .78rem; border: 0; }
  footer p { margin-top: 4px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div><span id="today"></span>　AI要約版<span id="updated"></span></div>
    <div class="right">
      <a href="#/foryou">あなたへのおすすめ</a>
      <a href="#/history">閲覧履歴</a>
    </div>
  </div>

  <div class="masthead">
    <a class="brand" href="#/">
      <span class="logo">AI Caster</span>
      <span class="tagline">むずかしいニュースを、三行で。</span>
    </a>
    <form class="search" id="sform" role="search">
      <input id="q" type="search" placeholder="キーワードで検索(例:金利、半導体)" aria-label="キーワード検索" autocomplete="off">
    </form>
  </div>
</div>
<div class="navline"><div class="wrap"><nav id="nav" aria-label="カテゴリ"></nav></div></div>

<main class="wrap">
  <div class="layout">
    <section id="main" aria-live="polite"></section>
    <aside id="side"></aside>
  </div>
</main>

<footer>
  <div class="wrap">
    <nav>
      <a href="#">運営者情報</a><a href="#">プライバシーポリシー</a><a href="#">免責事項</a><a href="#">お問い合わせ</a>
    </nav>
    <p>© <span id="year"></span> AI Caster</p>
    <p>要約はAIにより自動生成されており、正確性を保証するものではありません。詳細は必ず出典元でご確認ください。</p>
    <p>閲覧履歴・おすすめはお使いのブラウザ内にのみ保存され、サーバーには送信されません。本サイトには広告が掲載される場合があります。</p>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var CATS = ["経済", "テクノロジー", "国際", "社会", "科学", "スポーツ", "文化"];
  var CAT_COLOR = { "経済": "#8a5a2b", "テクノロジー": "#2f6f73", "国際": "#4a4f8a", "社会": "#8a3f4a", "科学": "#3f7a4a", "スポーツ": "#b5612c", "文化": "#7a4a8a" };
  var HIST_KEY = "sangyo.history.v1";
  var PAGE = 15;

  // news.json が読めない場合(file:// で開いた時など)の最小サンプル
  var FALLBACK = [
    { id: "sample-a", category: "経済", title: "【サンプル】主要企業の決算が出そろう、増益傾向が目立つ", summary: ["今期決算で増益を報告する企業が相次いだ。", "海外需要と価格改定が利益を押し上げた。", "為替や原材料価格の先行きには警戒感も残る。"], tags: ["決算", "物価", "円安"], source: "サンプル", url: "https://example.com/", date: new Date().toISOString() },
    { id: "sample-b", category: "テクノロジー", title: "【サンプル】新しいAIモデルが発表、処理速度が大幅に向上", summary: ["従来より高速に応答できる新モデルが発表された。", "長文の読み込みや要約の精度も改善されたとされる。", "企業向けが先行し、一般向けは順次開始予定。"], tags: ["AI", "半導体"], source: "サンプル", url: "https://example.com/", date: new Date(Date.now() - 3600e3).toISOString() }
  ];

  var state = { items: [], updated: null, limit: PAGE, room: null, blogs: [] };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var safeUrl = function (u) { return /^https?:\/\//i.test(u || "") ? u : "#"; };
  var pad = function (n) { return String(n).padStart(2, "0"); };

  /* ---------- 閲覧履歴(localStorage) ---------- */
  function loadHist() { try { var h = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
  function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 100))); } catch (e) {} }
  function addHist(it) {
    var h = loadHist().filter(function (x) { return x.id !== it.id; });
    h.unshift({ id: it.id, title: it.title, url: it.url, category: it.category, tags: it.tags || [], t: Date.now() });
    saveHist(h);
  }

  /* ---------- 関心プロファイルとおすすめ ---------- */
  function profile() {
    var h = loadHist(), cat = {}, tag = {};
    h.forEach(function (x) {
      cat[x.category] = (cat[x.category] || 0) + 1;
      (x.tags || []).forEach(function (t) { tag[t] = (tag[t] || 0) + 1; });
    });
    return { cat: cat, tag: tag, count: h.length, seen: new Set(h.map(function (x) { return x.id; })) };
  }
  function recommend() {
    var p = profile();
    if (!p.count) return [];
    var out = [];
    state.items.forEach(function (i) {
      if (p.seen.has(i.id)) return;
      var rel = 0, bestTag = null, bestW = 0;
      (i.tags || []).forEach(function (t) {
        var w = p.tag[t] || 0;
        rel += w * 2;
        if (w > bestW) { bestW = w; bestTag = t; }
      });
      var c = p.cat[i.category] || 0;
      rel += c;
      if (rel <= 0) return;
      var ageH = (Date.now() - new Date(i.date)) / 3.6e6;
      var score = rel + Math.max(0, 1 - ageH / 72);
      var reason = bestTag ? "「" + bestTag + "」関連の記事をよく読んでいるため" : i.category + "の記事をよく読んでいるため";
      out.push({ item: i, score: score, reason: reason });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  /* ---------- 描画パーツ ---------- */
  function articleHTML(i, reason) {
    var d = new Date(i.date), color = CAT_COLOR[i.category] || "#555";
    var chars = (i.summary || []).join("").length;
    var sec = Math.max(15, Math.round(chars / 8 / 5) * 5);
    var nums = ["一", "二", "三"];
    return '<article class="article">' +
      '<div class="meta"><div class="cat" style="color:' + color + '">' + esc(i.category) + '</div>' +
      '<div class="date"><span>' + (d.getMonth() + 1) + "/" + pad(d.getDate()) + "</span> <span>" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + "</span></div>" +
      '<div class="read">約' + sec + "秒で読める</div></div>" +
      "<div>" +
      '<h3><a class="title-link" data-id="' + esc(i.id) + '" href="' + esc(safeUrl(i.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + "</a></h3>" +
      (reason ? '<div class="reason">' + esc(reason) + "</div>" : "") +
      '<ol class="three">' + (i.summary || []).slice(0, 3).map(function (s, n) { return '<li data-n="' + nums[n] + '">' + esc(s) + "</li>"; }).join("") + "</ol>" +
      '<div class="tags">' + (i.tags || []).map(function (t) { return '<button data-tag="' + esc(t) + '">#' + esc(t) + "</button>"; }).join("") + "</div>" +
      '<div class="src">出典:' + esc(i.source) + "</div>" +
      "</div></article>";
  }
  function adInFeed() {
    return '<div class="ad-wrap"><div class="ad-label">広告</div><div class="ad-slot">' +
      "<!-- ▼ここに忍者AdMaxの広告タグを貼り付け --><span class=\"ad-placeholder\">広告枠</span></div></div>";
  }
  function listHTML(rows) {
    var out = [];
    rows.slice(0, state.limit).forEach(function (r, idx) {
      out.push(articleHTML(r.item || r, r.reason));
      if ((idx + 1) % 5 === 0 && idx + 1 < Math.min(rows.length, state.limit)) out.push(adInFeed());
    });
    if (rows.length > state.limit) out.push('<button class="more" data-more>さらに表示する</button>');
    return out.join("");
  }
  function head(eyebrow, title, sub) {
    return '<div class="eyebrow">' + esc(eyebrow) + '</div><h2 class="page-title">' + esc(title) + "</h2>" + (sub ? '<p class="page-sub">' + esc(sub) + "</p>" : "");
  }

  /* ---------- ビュー ---------- */
  function route() {
    var h = decodeURIComponent((location.hash || "#/").slice(1));
    var m;
    if ((m = h.match(/^\/cat\/(.+)$/))) return { name: "cat", v: m[1] };
    if ((m = h.match(/^\/search\/(.*)$/))) return { name: "search", v: m[1] };
    if (h === "/foryou") return { name: "foryou" };
    if (h === "/history") return { name: "history" };
    if (h === "/room") return { name: "room" };
    if (h === "/blog") return { name: "blog" };
    if ((m = h.match(/^\/blog\/([^/]+)$/))) return { name: "blogEntry", v: m[1] };
    return { name: "top" };
  }

  function viewMain(r) {
    var sorted = state.items;
    if (r.name === "top") {
      return head("LATEST", "新着ニュース", "AIが自動で収集し、要点を三行にまとめています。") + '<div style="margin-top:20px">' + (sorted.length ? listHTML(sorted) : '<div class="notice-box">まだニュースがありません。</div>') + "</div>";
    }
    if (r.name === "cat") {
      var rows = sorted.filter(function (i) { return i.category === r.v; });
      return head("CATEGORY", r.v) + '<div style="margin-top:20px">' + (rows.length ? listHTML(rows) : '<div class="notice-box">このカテゴリの記事はまだありません。</div>') + "</div>";
    }
    if (r.name === "search") {
      var terms = r.v.toLowerCase().split(/\s+/).filter(Boolean);
      var res = !terms.length ? [] : sorted.filter(function (i) {
        var hay = (i.title + " " + (i.summary || []).join(" ") + " " + (i.tags || []).join(" ") + " " + i.category + " " + i.source).toLowerCase();
        return terms.every(function (t) { return hay.indexOf(t) !== -1; });
      });
      return head("SEARCH", "「" + r.v + "」の検索結果", res.length + "件") + '<div style="margin-top:20px">' + (res.length ? listHTML(res) : '<div class="notice-box">一致する記事が見つかりませんでした。別のキーワードもお試しください。</div>') + "</div>";
    }
    if (r.name === "foryou") {
      var rec = recommend();
      var s = head("FOR YOU", "あなたへのおすすめ", "これまでに読んだ記事のカテゴリやキーワードから、まだ読んでいないニュースを選んでいます。");
      if (!rec.length) {
        s += '<div class="notice-box">' + (loadHist().length ? "おすすめできる未読の記事がまだありません。" : "まだ閲覧履歴がありません。気になる記事のタイトルを開くと、ここにおすすめが表示されます。") + "</div>";
        s += '<div class="section-head">新着ニュース</div>' + listHTML(sorted.slice(0, 5));
      } else {
        s += '<div class="section-head">おすすめ記事</div>' + listHTML(rec);
      }
      return s;
    }
    if (r.name === "history") {
      var hist = loadHist();
      var s2 = head("HISTORY", "閲覧履歴", "この端末のブラウザ内にのみ保存されています。");
      if (!hist.length) return s2 + '<div class="notice-box">閲覧履歴はまだありません。</div>';
      return s2 + '<ul class="hist" style="margin-top:20px;border-top:1px solid var(--line)">' + hist.map(histItem).join("") +
        '</ul><button class="more" data-clear>履歴をすべて削除</button>';
    }
    if (r.name === "room") {
      var room = state.room;
      if (!room || !Array.isArray(room.entries) || !room.entries.length) return head("AI MEETING ROOM", "AI会議室", "今日のニュースをもとに、AIメンバーが話し合います。") + '<div class="notice-box">今日の会議はまだ準備中です。ニュース更新後に投稿されます。</div>';
      var sourceItems = (room.sources || []).map(function (id) { return state.items.filter(function (x) { return String(x.id) === String(id); })[0]; }).filter(Boolean);
      return head("AI MEETING ROOM", "AI会議室", "ニュースを読んだAIメンバーの、架空の会話です。") +
        '<article class="room-card"><div class="room-date">' + esc(room.date || "") + ' ・ AIによる自動投稿</div><h3 class="room-title">' + esc(room.title || "今日のニュースを話そう") + '</h3><div class="room-talk">' + room.entries.map(function (e) { return '<div class="room-line"><span class="room-speaker">' + esc(e.speaker) + '</span><p>' + esc(e.text) + '</p></div>'; }).join("") + '</div>' +
        (sourceItems.length ? '<div class="room-sources">参考ニュース: ' + sourceItems.map(function (i) { return '<a href="' + esc(safeUrl(i.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a>'; }).join(" ／ ") + '</div>' : '<div class="room-sources">ニュースの見出しをもとにした会話です。最新の事実は出典記事をご確認ください。</div>') + '</article><div class="ad-wrap"><div class="ad-label">広告</div><div class="ad-slot" data-ad-slot="ai-room"><span class="ad-placeholder">AI会議室の広告枠</span></div></div>';
    }
    if (r.name === "blog") {
      var posts = state.blogs.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      return head("AI BLOG", "AIブログ", "生成AIやAIサービスの動きを、初心者にもわかりやすく紹介します。") + (posts.length ? posts.map(function (p) { return '<a class="blog-card" href="#/blog/' + encodeURIComponent(p.slug) + '"><div class="blog-meta">' + esc(p.date) + (p.category ? ' ・ ' + esc(p.category) : '') + '</div><h3 class="blog-title">' + esc(p.title) + '</h3><p class="blog-excerpt">' + esc(p.excerpt || "") + '</p></a>'; }).join("") : '<div class="notice-box">AIブログ記事はまだありません。</div>');
    }
    if (r.name === "blogEntry") {
      var post = state.blogs.filter(function (p) { return p.slug === r.v; })[0];
      if (!post) return head("AI BLOG", "記事が見つかりません") + '<a class="back-link" href="#/blog">AIブログ一覧へ戻る</a>';
      return '<article class="blog-article"><div class="blog-meta">' + esc(post.date) + (post.category ? ' ・ ' + esc(post.category) : '') + '</div><h2 class="page-title">' + esc(post.title) + '</h2><div class="blog-body">' + esc(post.body || "") + '</div><a class="back-link" href="#/blog">← AIブログ一覧へ戻る</a></article>';
    }
    return "";
  }

  function histItem(x) {
    var d = new Date(x.t);
    return '<li><div><a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(x.title) + "</a>" +
      '<div class="t">' + (d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ' に閲覧</div></div>' +
      '<button class="x" data-del="' + esc(x.id) + '" aria-label="履歴から削除">×</button></li>';
  }

  function viewSide() {
    var p = profile(), hist = loadHist(), s = "";
    s += '<div class="block"><h4>あなたの関心</h4>';
    if (!p.count) {
      s += '<p class="side-empty">記事を読むと、関心のあるカテゴリやキーワードがここに表示されます。</p>';
    } else {
      var cats = Object.keys(p.cat).sort(function (a, b) { return p.cat[b] - p.cat[a]; }).slice(0, 4);
      var max = p.cat[cats[0]];
      s += '<div class="interest">' + cats.map(function (c) {
        var pct = Math.round(p.cat[c] / max * 100);
        return '<div class="bar-row"><span style="color:' + (CAT_COLOR[c] || "#555") + '">◆ ' + esc(c) + '</span><span class="n">' + pct + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>';
      }).join("") + "</div>";
      var tags = Object.keys(p.tag).sort(function (a, b) { return p.tag[b] - p.tag[a]; }).slice(0, 8);
      if (tags.length) s += '<div class="side-tags">' + tags.map(function (t) { return '<button data-tag="' + esc(t) + '">#' + esc(t) + "</button>"; }).join("") + "</div>";
    }
    s += "</div>";

    s += '<div class="block"><h4>閲覧履歴' + (hist.length ? '<button data-clear>すべて削除</button>' : "") + "</h4>";
    s += hist.length ? '<ul class="hist">' + hist.slice(0, 5).map(histItem).join("") + "</ul>" : '<p class="side-empty">閲覧履歴はまだありません。</p>';
    s += "</div>";

    return s;
  }

  function renderNav(r) {
    var links = [{ h: "#/", t: "トップ", on: r.name === "top" }].concat(CATS.map(function (c) {
      return { h: "#/cat/" + encodeURIComponent(c), t: c, on: r.name === "cat" && r.v === c };
    }), [{ h: "ai-room.html", t: "AI会議室", on: false }, { h: "blog.html", t: "AIブログ", on: false }]);
    $("nav").innerHTML = links.map(function (l) { return '<a href="' + l.h + '"' + (l.on ? ' class="active"' : "") + ">" + esc(l.t) + "</a>"; }).join("");
  }

  function renderSide() { $("side").innerHTML = viewSide(); }

  function render() {
    var r = route();
    renderNav(r);
    $("main").innerHTML = viewMain(r);
    renderSide();
    $("q").value = r.name === "search" ? r.v : $("q").value;
  }

  /* ---------- イベント ---------- */
  document.addEventListener("click", function (e) {
    var a = e.target.closest(".title-link");
    if (a) {
      var it = state.items.filter(function (x) { return String(x.id) === a.dataset.id; })[0];
      if (it) { addHist(it); renderSide(); }
      return;
    }
    var tag = e.target.closest("[data-tag]");
    if (tag) { location.hash = "#/search/" + encodeURIComponent(tag.dataset.tag); return; }
    var del = e.target.closest("[data-del]");
    if (del) { saveHist(loadHist().filter(function (x) { return String(x.id) !== del.dataset.del; })); render(); return; }
    if (e.target.closest("[data-clear]")) {
      if (confirm("閲覧履歴をすべて削除しますか?")) { saveHist([]); render(); }
      return;
    }
    if (e.target.closest("[data-more]")) { state.limit += PAGE; $("main").innerHTML = viewMain(route()); }
  });
  $("sform").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("q").value.trim();
    location.hash = v ? "#/search/" + encodeURIComponent(v) : "#/";
  });
  window.addEventListener("hashchange", function () { state.limit = PAGE; render(); window.scrollTo(0, 0); });

  /* ---------- 初期化 ---------- */
  $("today").textContent = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  $("year").textContent = new Date().getFullYear();

  Promise.all([
    fetch("news.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).catch(function () { return { items: FALLBACK }; }),
    fetch("ai_room.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).catch(function () { return null; }),
    fetch("blog.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).catch(function () { return []; })
  ]).then(function (dataSets) {
      var data = dataSets[0];
      var items = Array.isArray(data) ? data : (data.items || []);
      state.items = items.filter(function (i) { return i && i.title && i.id != null; })
        .sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      state.updated = data.updated || null;
      if (state.updated) {
        var u = new Date(state.updated);
        if (!isNaN(u)) $("updated").textContent = "　最終更新 " + pad(u.getHours()) + ":" + pad(u.getMinutes());
      }
      state.room = dataSets[1];
      state.blogs = Array.isArray(dataSets[2]) ? dataSets[2] : (dataSets[2].posts || []);
      render();
    });
})();
</script>
</body>
</html>
