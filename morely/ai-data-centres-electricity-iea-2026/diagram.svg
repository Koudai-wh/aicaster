<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc"><title id="title">AIの電力需要を効率、利用量、地域制約に分けた図</title><desc id="desc">一件あたりの効率と、全体の電力消費は別に確認します。</desc><rect width="800" height="250" rx="18" fill="#f5f8fb"/><text x="34" y="53" class="eyebrow">MORELY / 経済・社会</text><text x="34" y="84" class="title">AIの電力消費はモデルの性能だけでは決まらない：IEAの2026</text><g><rect x="34" y="112" width="204" height="88" rx="14" fill="#ffffff" stroke="#b7c8d8" stroke-width="2"/><circle cx="58" cy="136" r="14" fill="#1769aa"/><text x="58" y="141" text-anchor="middle" class="n">1</text><text x="136" y="163" text-anchor="middle" class="step">計算効率は改善</text></g><path d="M242 156h30m-8-8 8 8-8 8" fill="none" stroke="#1769aa" stroke-width="3"/><g><rect x="280" y="112" width="204" height="88" rx="14" fill="#e8f1f8" stroke="#b7c8d8" stroke-width="2"/><circle cx="304" cy="136" r="14" fill="#1769aa"/><text x="304" y="141" text-anchor="middle" class="n">2</text><text x="382" y="163" text-anchor="middle" class="step">利用量も拡大</text></g><path d="M488 156h30m-8-8 8 8-8 8" fill="none" stroke="#1769aa" stroke-width="3"/><g><rect x="526" y="112" width="204" height="88" rx="14" fill="#ffffff" stroke="#b7c8d8" stroke-width="2"/><circle cx="550" cy="136" r="14" fill="#1769aa"/><text x="550" y="141" text-anchor="middle" class="n">3</text><text x="628" y="163" text-anchor="middle" class="step">地域の電力網に集中</text></g><style>text{font-family:Arial,'Hiragino Sans','Yu Gothic',sans-serif;fill:#202124}.eyebrow{font-size:13px;letter-spacing:2px;fill:#1769aa;font-weight:700}.title{font-size:20px;font-weight:700}.step{font-size:16px;font-weight:700}.n{font-size:13px;fill:white;font-weight:700}</style></svg>